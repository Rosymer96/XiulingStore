<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XiulingStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Delius&family=Figtree:ital,wght@0,300..900;1,300..900&family=Patrick+Hand&family=Urbanist:ital,wght@0,510;1,510&family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/be504bf0cf.js" crossorigin="anonymous"></script>
    <script src="data.js" defer></script>
    <script src="main.js" defer></script>

    
</head>
<body>
    <header class="header">
        <div class="navbar-container">
        <div class="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </div>
        <div class="storeName">XIULING STORE</div>
        <nav class="navbar">
            <ul class="menu">
                <li><a>Inicio</a></li>
                <li><a>Joyas</a></li>
                <li><a>Sale</a></li>
            </ul>
            <div class="navLinks">
                <a><i class="fa-solid fa-user"></i></a>
                <a><i class="fa-solid fa-magnifying-glass"></i></a>
                <a><i class="fa-solid fa-cart-shopping shoppingCarIcon"></i></a>
            </div>
        </nav>
        </div>
        <div class="shoppingCarContainer">
            <div class="shoppingPill">
                <div>Carrito de compras</div>
                <div class="shoppingCar"></div>
                <div>Total: €<span class="totalPrice">0</span></div>
                <button class="btnShoppingCar btnClearCar">Vaciar Carrito</button>
                <button class="btnShoppingCar btnStartOrder">Comenzar pedido</button>
            </div>
        </div>
        <div class="messageOrder">
            <button class="btnCloseMessageOrder">✖</button>
            <div class="messageThanks">El pedido se ha procesado con éxito. ¡Muchas gracias por tu compra!</div>
        </div>
    </header>

    </main>

        <span>Copyright©2025</span>
        <span>-</span>
        <a href="#" class="avisoLegal">Aviso Legal</a>

        <a href="#"class="cookies">Cookies</a>
